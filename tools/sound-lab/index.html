<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Doberega · Звукова лабораторія</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;500;600&display=swap" />
    <style>
      /* The sound lab: candidates for each game sound, side by side, to listen to and pick. */
      :root {
        --bg: #0e1715;
        --surface: #14221f;
        --line: #2c403b;
        --text: #e9e3cf;
        --text-2: #b8b3a2;
        --muted: #7f8b84;
        --gold: #e2b85e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 16px 40px;
        color: var(--text);
        font: 20px/1.3 "Handjet", ui-monospace, Menlo, monospace;
        background: var(--bg);
      }
      main { max-width: 860px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 34px; font-weight: 600; }
      h2 { margin: 28px 0 6px; color: var(--text-2); font-size: 22px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
      p { margin: 0 0 12px; color: var(--muted); font-size: 18px; }
      .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 12px 0 4px; color: var(--text-2); font-size: 18px; }
      .controls label { display: flex; gap: 6px; align-items: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
      .sound { display: grid; gap: 4px; padding: 12px 14px; border: 2px solid var(--line); color: var(--text); font: inherit; text-align: left; background: var(--surface); cursor: pointer; }
      .sound:hover { border-color: var(--muted); }
      .sound:active { transform: translateY(2px); }
      .sound.is-playing { border-color: var(--gold); }
      .sound.is-chosen { border-color: #4f7a5a; background: #16281f; }
      .group-title { margin-top: 18px; color: var(--gold); }
      .done { margin-top: 36px; padding-top: 12px; border-top: 2px solid var(--line); }
      .done summary { color: var(--text-2); font-size: 24px; cursor: pointer; }
      .done summary:hover { color: var(--text); }
      .sound strong { font-size: 22px; font-weight: 600; }
      .sound strong b { color: var(--gold); font-weight: 600; }
      .sound span { color: var(--text-2); font-size: 17px; }
      button:focus-visible, input:focus-visible { outline: 2px dashed var(--gold); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Звукова лабораторія</h1>
      <p>Кандидати для звуків гри. Натисни, щоб послухати; назви номери тих, що подобаються. Кожен звук синтезується наживо, тож щоразу трохи інший, як і буде в грі.</p>
      <div class="controls">
        <label><input type="checkbox" id="vary" checked /> Невеликий випадковий зсув (як у грі)</label>
        <label>Гучність <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" /></label>
      </div>
      <div id="sections"></div>
    </main>
    <!-- Always the latest candidates, never a cached copy. -->
    <script type="module">import(`./lab.js?v=${Date.now()}`);</script>
  </body>
</html>
